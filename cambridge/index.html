
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Clases Extracurriculares</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #0f172a, #1d4ed8);
            color: white;
        }

        .contenedor {
            width: 100%;
            max-width: 600px;
            padding: 35px 25px;
            background: white;
            color: #1e293b;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 10px 35px rgba(0, 0, 0, 0.25);
        }

        h1 {
            font-size: 25px;
            line-height: 1.4;
            margin-bottom: 30px;
        }

        .boton-clase {
            display: block;
            width: 100%;
            padding: 20px;
            border: none;
            border-radius: 12px;
            background: #2563eb;
            color: white;
            font-size: 17px;
            font-weight: bold;
            text-decoration: none;
            line-height: 1.5;
            cursor: pointer;
            transition: background 0.3s, transform 0.2s;
        }

        .boton-clase:hover {
            background: #1d4ed8;
            transform: translateY(-2px);
        }

        .instruccion {
            margin-top: 20px;
            color: #64748b;
            font-size: 14px;
        }

        @media (max-width: 480px) {
            .contenedor {
                padding: 28px 18px;
            }

            h1 {
                font-size: 22px;
            }

            .boton-clase {
                font-size: 15px;
            }
        }
    </style>
</head>

<body>

    <main class="contenedor">

        <h1>SELECCIONA LA CLASE EXTRACURRICULAR:</h1>

        <a
            class="boton-clase"
            href="https://drive.google.com/drive/folders/10ImG2QOKiJVz2pI_wrdSsszZenJcdhCO?usp=sharing"
            target="_blank"
            rel="noopener noreferrer"
        >
            1. DISEÑO WEB Y DESARROLLO DE APPS CON IA
        </a>

        <p class="instruccion">
            Haz clic en la clase para acceder al material educativo.
        </p>

    </main>

</body>
</html>
