<script>

    const grupoWhatsApp =
        "https://chat.whatsapp.com/L0BfffMGJKm2oaYUT5Ql5N";

    // Intentar abrir WhatsApp en una nueva pestaña
    setTimeout(function() {

        const nuevaVentana = window.open(
            grupoWhatsApp,
            "_blank",
            "noopener,noreferrer"
        );

        // Si el navegador bloquea la ventana,
        // el botón seguirá disponible.
        if (!nuevaVentana) {
            console.log("El navegador bloqueó la nueva pestaña.");
        }

    }, 500);

</script>
