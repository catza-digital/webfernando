<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d2844"><title>ITDS | Tutor Educativo</title><style>
:root{--navy:#0d2844;--blue:#1766a3;--teal:#118778;--bg:#f4f8fc;--ink:#172b41;--muted:#63768b;--line:#dbe5ef}*{box-sizing:border-box}body{margin:0;background:var(--bg);font:16px/1.5 system-ui,-apple-system,Segoe UI,Arial;color:var(--ink)}button,input{font:inherit}button{cursor:pointer}button:focus-visible,input:focus-visible{outline:3px solid #ffce56;outline-offset:2px}.shell{min-height:100dvh;display:flex;flex-direction:column}.top{background:var(--navy);color:white;padding:15px max(16px,calc((100% - 1130px)/2));display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-weight:900;font-size:22px;letter-spacing:.5px}.brand small{display:block;font-size:11px;font-weight:500;color:#b6d7ed;letter-spacing:0}.top button{border:1px solid #7890a8;color:white;border-radius:12px;padding:8px 12px;background:#213c5b}.wrap{width:min(1100px,calc(100% - 30px));margin:25px auto 45px;flex:1}.panel{background:white;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 10px 30px #152d4b0b}.hero{background:linear-gradient(135deg,#12395e,#127b83);color:white;padding:40px 30px}.hero h1{font-size:clamp(26px,4vw,42px);line-height:1.2;margin:10px 0}.hero p{max-width:650px;color:#e8f8fa}.pill{font-size:12px;letter-spacing:.5px;font-weight:800;border-radius:99px;display:inline-block;padding:5px 12px;background:#e8f6f4;color:#08766b}.hero .pill{background:#ffffff24;color:white}.btn{background:var(--teal);color:white;border:0;border-radius:12px;padding:13px 18px;font-weight:750}.btn.secondary{background:#e8f1f9;color:#114774}.btn.ghost{background:white;border:1px solid var(--line);color:var(--ink)}.btn:disabled{opacity:.55;cursor:not-allowed}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}.grid3{grid-template-columns:repeat(3,minmax(0,1fr))}.tile{text-align:left;border:1px solid var(--line);border-radius:17px;background:white;padding:19px;min-height:116px;transition:.15s;display:flex;flex-direction:column;gap:5px}.tile:hover{border-color:#158d9b;transform:translateY(-1px)}.tile b{font-size:17px}.tile small,.muted{color:var(--muted)}.icon{font-size:27px}.head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin:0 0 20px}.head h1,.head h2{margin:0;font-size:clamp(22px,3.5vw,29px)}.crumb{color:var(--muted);font-size:13px;margin-bottom:14px}.crumb button{background:none;color:#146a9f;border:0;padding:0;text-decoration:underline}.list{display:flex;flex-direction:column;gap:10px}.item{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;background:#f7fafc;border:1px solid var(--line);border-radius:13px;padding:14px 16px;text-align:left}.item:hover{border-color:#14908d}.item strong{display:block}.item small{color:var(--muted)}.lesson p{line-height:1.75}.lesson p+p{margin-top:15px}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:20px}.tabs button{border:1px solid #cfdeea;background:white;color:#2c536f;border-radius:100px;padding:9px 14px}.tabs button.active{background:var(--navy);color:white}.q{border:1px solid var(--line);border-radius:15px;padding:17px;margin-bottom:16px}.option{display:flex;gap:10px;align-items:flex-start;margin:10px 0;padding:10px;border:1px solid var(--line);border-radius:9px;cursor:pointer}.feedback{padding:14px;border-radius:12px;background:#e8f5f1;color:#115b4f;margin-top:15px}.feedback.warn{background:#fff1db;color:#6b4915}.meter{height:10px;background:#e5edf4;border-radius:12px;overflow:hidden}.meter>div{height:100%;background:var(--teal);width:0%}.field{width:100%;padding:13px;border-radius:11px;border:1px solid #bbcada;margin:12px 0}.center{max-width:500px;margin:6vh auto}.desk{background:linear-gradient(135deg,#13508e,#74b5d9);border-radius:16px;min-height:270px;padding:16px;color:white;position:relative}.desktop-icons{display:flex;gap:16px;flex-wrap:wrap}.desk-icon{background:#ffffff21;color:white;border:1px solid #ffffff55;border-radius:10px;padding:12px;min-width:100px}.taskbar{margin-top:90px;background:#dfe9f2;color:#123;padding:9px;border-radius:9px}.files{border:1px solid var(--line);border-radius:13px;padding:18px;min-height:100px;background:#f9fbfd}.chat{background:#f2f7fa;border-radius:15px;padding:15px;min-height:120px}.bubble{background:white;border-radius:13px;padding:12px 15px;margin:10px 0;max-width:90%;border:1px solid #e0eaf2}.bubble.user{background:#d7f0eb;margin-left:auto}.footer{text-align:center;padding:20px;font-size:12px;color:var(--muted)}@media(max-width:650px){.top{padding:12px 15px}.wrap{width:calc(100% - 20px);margin:12px auto 30px}.panel{padding:17px;border-radius:15px}.hero{padding:25px 20px}.grid,.grid3{grid-template-columns:1fr}.tile{min-height:83px}.head{flex-direction:column}.actions .btn{flex:1}.desk{min-height:250px}.taskbar{margin-top:65px}.tabs button{padding:8px 10px;font-size:13px}}
.chatbot-frame{border:1px solid #dce7ef;border-radius:16px;overflow:hidden;background:#fff}.chatbot-head{background:#0d2844;color:white;padding:13px 16px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}.chatbot-head small{color:#b6d7ed}.chatbot-frame .chat{height:min(47vh,390px);min-height:225px;overflow-y:auto;border-radius:0;white-space:pre-line;scroll-behavior:smooth}.chat-suggestions{display:flex;flex-wrap:wrap;gap:7px;padding:12px;background:#f7fafc}.chat-suggestions button{font-size:13px;padding:9px 11px}.chat-form{display:flex;gap:8px;padding:12px;border-top:1px solid #dce7ef}.chat-form input{flex:1;min-width:0;border:1px solid #bed1dc;border-radius:12px;padding:11px;font:inherit}.chat-note{padding:0 12px 12px;font-size:12px;color:#63768b}@media(max-width:650px){.chat-form button{padding:11px}.chatbot-frame .chat{height:42dvh;min-height:220px}}

/* v03: tutor conversacional a pantalla completa */
body.tutor-full{overflow:hidden}
body.tutor-full .top,body.tutor-full .footer{display:none}
body.tutor-full .shell{height:100dvh;min-height:0}
body.tutor-full .wrap{position:fixed;inset:0;width:100%;max-width:none;margin:0;padding:0;height:100dvh;overflow:hidden}
body.tutor-full .wrap>.crumb{display:none}
body.tutor-full .wrap>.panel{height:100%;border:none;border-radius:0;padding:0;box-shadow:none;display:flex;flex-direction:column}
body.tutor-full .wrap>.panel>.pill,body.tutor-full .wrap>.panel>h1,body.tutor-full .wrap>.panel>p,body.tutor-full .wrap>.panel>.tabs,body.tutor-full .wrap>.panel>.actions{display:none}
body.tutor-full #area{height:100%;min-height:0;display:flex;flex-direction:column}
body.tutor-full #area>h2,body.tutor-full #area>p{display:none}
body.tutor-full .chatbot-frame{height:100%;min-height:0;display:flex;flex-direction:column;border:none;border-radius:0}
body.tutor-full .chatbot-head{flex:0 0 auto;align-items:center;flex-wrap:nowrap;padding:13px max(14px,env(safe-area-inset-right)) 13px max(14px,env(safe-area-inset-left));gap:12px}
body.tutor-full .chatbot-head .tutor-title{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}
body.tutor-full .chatbot-head .tutor-title strong{white-space:nowrap;text-overflow:ellipsis;overflow:hidden;font-size:15px}
body.tutor-full .chatbot-head small{font-size:11px}
body.tutor-full .tutor-back{background:#ffffff1a;color:white;border:1px solid #ffffff48;border-radius:10px;padding:9px 12px;white-space:nowrap}
body.tutor-full .chatbot-frame .chat{flex:1 1 auto;height:auto;min-height:0;overflow-y:auto;overscroll-behavior:contain;padding:16px max(12px,calc((100vw - 840px)/2));background:#edf4f8}
body.tutor-full .bubble{max-width:min(85%,640px);white-space:pre-line;overflow-wrap:anywhere}
body.tutor-full .chat-suggestions{flex:0 0 auto;overflow-x:auto;flex-wrap:nowrap;gap:8px;padding:9px max(12px,calc((100vw - 840px)/2))}
body.tutor-full .chat-suggestions button{white-space:nowrap;flex:0 0 auto}
body.tutor-full .chat-form{flex:0 0 auto;padding:12px max(12px,calc((100vw - 840px)/2));background:white}
body.tutor-full .chat-form input{font-size:16px}
body.tutor-full .chat-note{flex:0 0 auto;text-align:center;padding:0 10px max(8px,env(safe-area-inset-bottom));background:white}
@media(max-width:650px){body.tutor-full .chatbot-head{padding:11px 12px}body.tutor-full .chatbot-head .tutor-title strong{font-size:14px}body.tutor-full .chatbot-frame .chat{height:auto;min-height:0}body.tutor-full .chat-form{padding:9px 10px}body.tutor-full .chat-suggestions{padding:8px 10px}body.tutor-full .chat-note{font-size:10px}}
</style></head><body><div class="shell"><header class="top"><div class="brand">ITDS <small>Instituto Técnico Domingo Savio · Tutor Educativo</small></div><button id="out" onclick="logout()" hidden>Salir</button></header><main id="app" class="wrap" aria-live="polite"></main><footer class="footer">Demo académica ITDS · El progreso se guarda únicamente en este navegador · No es un sistema de autenticación real</footer></div><script>
const syllabus={"windows": [{"title": "Introducción a Windows (Sistema Operativo)", "content": ["Antes de empezar a trabajar en esta rama se deben conocer los conceptos de algunos términos bastante utilizados en esta área, por ejemplo, Informática, Computación, Computadora, Información, Datos y otros los cuales los definiremos a continuación.", "INFORMÁTICA.- Es la Ciencia que estudia el manejo de las computadoras o el manejo de la información que estas poseen.  La palabra Informática proviene de las palabras INFORmación autoMÁTICA.", "INFORMACIÓN.- Es el conjunto de datos que están almacenados en un computador los cuales son introducidos por el usuario (persona que usa la computadora).", "COMPUTACIÓN.- Es el manejo o trabajo que se realiza en un computador. El manipular los elementos o la información guardada en esta herramienta también significa Computación.", "COMPUTADOR.- Máquina electrónica que se utiliza para procesar la Información con un fin específico de obtener resultados rápidos y correctos.", "Un computador de divide en dos elementos básicos: El HARDWARE y el SOFTWARE", "HARDWARE.- Parte material o física, todo lo que se puede ver cómo ser el Monitor, el Teclado, el Mouse, el CPU, la Impresora, las Unidades de Almacenamiento, las Tarjetas, los Cables, etc."], "quiz": [["¿Cuál corresponde a la parte física del computador?", ["Software", "Hardware", "Sistema operativo"], 1, "El hardware incluye monitor, teclado, mouse y otros dispositivos."], ["¿Qué tipo de elemento es Microsoft Word?", ["Software de aplicación", "Tarjeta de red", "Periférico de entrada"], 0, "El documento incluye Microsoft Word como software de aplicación."]]}, {"title": "El escritorio de Windows", "content": ["El escritorio es la pantalla Principal del WINDOWS la cual aparece al encender el computador o cuando no se tiene un programa abierto. Las partes o elementos del escritorio son los siguientes:", "Para que la Barra de Tareas se vea con el orden de las versiones anteriores se debe realizar el siguiente procedimiento:", "La nueva pantalla de Inicio de Windows 10, es reconocible gracias a sus iconos dinámicos, muestra ahora un nuevo menú pensado para los usuarios.", "Práctico del material: identificar el botón Inicio, los iconos y la barra de tareas; mover y organizar iconos; abrir Este equipo y la Papelera de reciclaje."], "quiz": [["¿Qué elemento permite iniciar y buscar aplicaciones?", ["Barra de título", "Botón Inicio", "Papel tapiz"], 1, "El botón Inicio permite visualizar y abrir aplicaciones."], ["¿Qué acción suele abrir un icono del escritorio?", ["Doble clic", "Desplazar el puntero", "Solo presionar Shift"], 0, "En el texto guía se enseña doble clic para abrir iconos."], ["¿Dónde se ven las aplicaciones abiertas?", ["Barra de tareas", "Fondo de pantalla", "Papelera"], 0, "La barra de tareas muestra los programas activos."]]}, {"title": "Abrir programas o aplicaciones", "content": ["Un PROGRAMA es una herramienta que se utiliza en el Computador para realizar diferentes trabajos. Se llama también Aplicación, por ejemplo: El Paint, el Block de Notas, la Calculadora, el Word, Excel, Power Point, etc.", "Existen diferentes formas de ingresar o abrir Programas o Aplicaciones, en este capítulo veremos las 3 formas más utilizadas.", "Esta forma se utiliza solo con ubicar el Icono en el Escritorio e ingresar de forma rápida.", "Doble Clic en el Icono del programa a Abrir", "Forma más usada por lo general porque se utiliza el Botón Inicio.", "Clic en el programa que desea abrir (Excel, Word, Power Point, Block de Notas, Calculadora, Paint, etc.)", "Como su nombre lo indica es la manera más segura para abrir un Programa, porque se utiliza el nombre correcto del archivo de dicho Programa."], "quiz": [["¿Qué comando permite abrir Paint desde Ejecutar?", ["WINWORD", "MSPAINT", "CALC"], 1, "El material enumera MSPAINT para Paint."], ["¿Qué comando abre el Bloc de notas?", ["NOTEPAD", "EXPLORER", "POWERPNT"], 0, "El nombre de archivo enseñado es NOTEPAD."]]}, {"title": "Partes de un teclado y sus teclas principales", "content": ["El teclado es un dispositivo de entrada utilizado para introducir datos al computador y hacer algunas acciones con una, dos o más teclas, llamadas atajos o métodos abreviados a continuación vemos las partes del teclado y sus teclas más importantes.", "El Teclado se divide en las siguientes partes:", "Anteriormente vimos que el teclado puede dividirse en varias partes según el modelo o tipo de teclado, sin embargo, los más comunes y utilizados se divide entre 5 a 7 partes, Vamos a entender el concepto y para qué sirve cada grupo de esta división dentro del teclado.", "Teclado Alfanumérico: Es el principal bloque de teclas. Contiene las letras, los diez dígitos decimales, los signos de puntuación y la barra espaciadora. Cada tecla permite obtener caracteres distintos según se utilice o no en combinación con alguna de otras teclas.", "Teclado Numérico: Facilita la introducción de números en el ordenador. Sus teclas tienen acciones distintas según esté o no activado.", "Teclas De Función: Son las doce teclas de la fila superior (van desde la a la ). Su función varía según el programa informático que se esté utilizando. En un procesador de textos, por ejemplo, sirven para guardar el documento, buscar y reemplazar palabras, etc.", "Teclas Especiales: Estas teclas son las que te sirven para desplazarte por documentos o páginas web y editar algunos textos. Entre ellas están: Supr, Inicio, Fin, RePág, AvPág, ImpPt, y muchas de ellas combinadas sirven para crear atajos en diferentes programas de nuestros ordenadores."], "quiz": [["¿Qué combinación permite copiar?", ["Ctrl + X", "Ctrl + C", "Alt + F4"], 1, "Ctrl + C copia y Ctrl + V pega."], ["¿Qué tecla borra a la izquierda del cursor?", ["Backspace", "Shift", "Tab"], 0, "Retroceso o Backspace elimina a la izquierda del cursor."]]}, {"title": "Manejo de ventanas", "content": ["Una ventana es la estructura de un programa o aplicación abierta en Windows. Sus elementos o partes que componen dicha ventana son las siguientes:", "Existen dos tipos de ventanas las del sistema operativo y las de aplicación", "Los Cuadros de Diálogo son Áreas o Espacios que Aparecen en forma automática cuando Windows o un programa necesitan información adicional para terminar con un proceso, tarea o función.", "Los cuadros de dialogo pueden tener varios elementos tales como:", "Este proceso ordena u organiza 2 ventanas que estén activas o abiertas en la pantalla. (No deberán estar Minimizadas). Las ventanas activas pueden tener una organización automática en formatos diferentes por ejemplo:", "CASCADA\t    \t\t     Ventanas Apiladas\t   Ventanas en Paralelo", "Clic en Botón derecho sobre la Barra de Tareas ( en un espacio vacío)"], "quiz": [["¿Qué botón hace que una ventana ocupe toda la pantalla?", ["Minimizar", "Cerrar", "Maximizar"], 2, "Maximizar amplía la ventana a toda la pantalla."], ["¿Qué botón oculta temporalmente una ventana en la barra de tareas?", ["Minimizar", "Cerrar", "Eliminar"], 0, "Minimizar permite recuperar la ventana desde la barra de tareas."]]}, {"title": "Aplicaciones de Windows", "content": ["Los accesorios del Windows son programas que sirven para realizar una tarea o trabajo específico, entre los que podemos citar La Calculadora, El Bloc de Notas, Paint, El WordPad, etc. Analizaremos los más importantes. Para poder abrir algunos de estos programas se debe seguir el siguiente proceso:", "4º\tHacer 1 Clic sobre el icono de Calculadora para poder ingresar", "La aplicación Paint se puede usar para crear dibujos en un área de dibujo en blanco o en imágenes existentes. Muchas de las herramientas que se usan en Paint se encuentran en la Cinta, ubicada debajo de su ficha correspondiente en la ventana de Paint.", "Para crear o realizar un dibujo en Paint se utilizan las herramientas, pinceles, y formas son su respectivo tamaño de línea:", "Herramientas: Lápiz, Bote de pintura, Texto, Borrador, Cuentagotas, Lupa", "Pinceles: Presenta diferentes tipos de pinceles", "Formas: Presenta diversas figuras simples"], "quiz": [["¿Qué aplicación permite realizar dibujos?", ["Paint", "Calculadora", "Bloc de notas"], 0, "Paint utiliza lápiz, borrador, pinceles y formas."]]}, {"title": "Unidades de almacenamiento", "content": ["Son Dispositivos o medios que sirven para guardar información o los datos que usted tenga en la memoria del computador, entre ellos podemos mencionar y mostrar los siguientes:", "El Disco Duro o Unidad C: como se lo llama comúnmente es el lugar donde esta almacenada toda la información importante de sistema y los programas componentes del Windows.", "Un disco duro sólido o disco SSD es un sistema de almacenamiento que guarda los datos en chips. El disco sólido no tiene partes mecánicas en movimiento como los discos duros tradicionales. La capacidad de almacenamiento de un disco duro sólido llega actualmente hasta los 2TB y el precio por TB es mucho más alto que el de un disco duro mecánico. Podemos encontrar el disco sólido con conexiones SATA y M.2 2280.", "El CD-ROM es una unidad de tipo externo (fuera del computador). Sirve para guardar gran cantidad de información. Para guardar datos se requiere de un dispositivo llamado Quemador o Grabador. Para leer los datos del CD solo necesita de un elemento llamado Lector de CD.", "Flash Memory, es una pequeña Unidad de almacenamiento donde se podrán guardar archivos. Es ideal para guardar datos de prácticas archivos de audio y video y es también un dispositivo de tipo externo.", "GUARDAR LA INFORMACIÓN, DATOS O ARCHIVOS", "Guardar, Grabar, Almacenar, Archivar o Salvar es lo mismo. Significa llevar la información de la memoria del computador a una Unidad de Almacenamiento. Para realizar este proceso solo existe una forma para todos los programas del Windows y es de la siguiente manera."], "quiz": [["¿Cuál es una unidad de almacenamiento?", ["Monitor", "SSD", "Mouse"], 1, "El material presenta discos SSD, HDD y memorias flash."]]}, {"title": "Panel de control", "content": ["El Panel de control sirve para cambiar la configuración de Windows, ya que el usuario puede en el momento que lo desee cambiar las opciones que están predeterminadas, como cambiar la hora, configurar una impresora, ajustar el teclado o ratón... Pero el Panel de control va mucho más allá, como poder agregar un nuevo hardware), instalar o eliminar software, correo, fuentes, y configurar aspectos más serios del ordenador.", "Cuando se dice que los muestra por categoría nos referimos a que según el tipo de uso del icono de esta manera está organizados en diferentes grupos y en la vista completa se despliegan todos sin separación por grupo o algo así.", "CONFIGURACIONES MÁS IMPORTANTES DEL PANEL DE CONTROL", "Clic en Ver Por (seleccionar Iconos Pequeños)", "Una vez realizados los cambios dar Clic en botón ACEPTAR.", "Clic en Ver Por (seleccionar Iconos Pequeños)", "Abrir el Panel de Control e ingresar a la configuración del Mouse."], "quiz": [["¿Para qué sirve el Panel de control?", ["Ajustar la configuración de Windows", "Editar una fotografía", "Navegar por Internet"], 0, "Sirve para cambiar configuraciones del sistema."]]}, {"title": "Configuración de escritorio", "content": ["Veremos procesos que se utilizan para cambiar los Temas, Fondo, Bordes y Protector de pantalla", "Clic Derecho en un espacio vacío del Escritorio y Clic en Personalizar", "Haga clic sobre la imagen para colocarla de fondo, o seleccione más de una imagen para crear una presentación", "Sí queremos utilizar una imagen que no se encuentre en la lista predeterminada dar un clic en el botón EXAMINAR y buscar la imagen.", "Seleccione la POSICIÓN de la imagen (Rellenar, expandir, mosaico o centro)", "Configure el tiempo que quiera que la imagen se modifique", "Una vez elegidos los colores e intensidad, cerrar todas las ventanas."], "quiz": [["¿Cómo se crea una carpeta en el escritorio según el texto guía?", ["Clic derecho → Nuevo → Carpeta", "Abrir Calculadora", "Minimizar todo"], 0, "Se enseña usar el menú contextual, opción Nuevo y Carpeta."]]}, {"title": "El Explorador de archivos", "content": ["El Explorador de Archivos (anteriormente llamado Explorador Windows), es uno de los programas más importantes del Windows, su uso es de bastante utilidad para el control y manejo de la información o archivos que posee el computador. Con este Software aprenderemos como copiar, mover, borrar, editar uno o varios archivos. Igualmente veremos cómo organizar debidamente la información almacenada en el disco.", "Antes de comenzar debemos conocer 2 elementos que son muy importante los cuales son los Archivos y las Carpetas.", "Clic en la opción Explorador de Archivos", "Cinta de opciones: Este elemento permite trabajar de manera fácil e intuitiva y en Windows 10 adoptaron esta nueva característica. La cinta de opciones alberga todas las herramientas necesarias para trabajar con las carpetas y archivos de la ventana.", "Para el trabajo con carpetas y archivos solo es necesario, seleccionar el elemento y dar un clic en el comando requerido y completar el procedimiento, por ejemplo: Copiar, eliminar, Cambiar nombre.", "El Panel de Navegación (Estructura) Muestra una vista jerárquica de toda la estructura de almacenamiento del equipo y los elementos componentes son: Escritorio, ESTE EQUIPO, Red. Las Unidades son Disco C:, D:, CD-ROM, etc. y las carpetas son los iconos de color amarillo.", "El Área o Panel de Contenido Muestra los archivos y carpetas almacenadas en la carpeta seleccionada o el dispositivo de almacenamiento."], "quiz": [["¿Para qué sirve el Explorador de archivos?", ["Organizar y manejar archivos y carpetas", "Crear diapositivas", "Editar sonido"], 0, "El texto describe copiar, mover, borrar y organizar archivos."]]}, {"title": "Buscar archivos", "content": ["Para buscar un archivo o Carpeta y saber en qué lugar está guardado se debe saber bien el nombre del archivo o por lo menos parte del mismo. La siguiente es una Lista de los programas más importantes y su nombre de archivo correcto:", "Un archivo está compuesto de 3 elementos básicos que son:", "LISTA DE EXTENSIONES DE ARCHIVOS Y SUS PROGRAMAS", "LA BÚSQUEDA SIRVE PARA VER LA UBICACIÓN DEL ARCHIVO COMO TAMBIÉN ENVIAR DICHO ARCHIVO COMO ICONO EN EL ESCRITORIO Y ASÍ PODER INGRESAR MAS RÁPIDAMENTE AL PROGRAMA.", "¿CÓMO BUSCAR? SIGA EL SIGUIENTE PROCEDIMIENTO:", "En el Panel izquierdo elegir el lugar donde se realizará la búsqueda: (Elegir Equipo)", "En la parte superior derecha aparece el cuadro de búsqueda y en el mismo escribir el nombre del archivo"], "quiz": [["¿Qué dato ayuda a encontrar un archivo?", ["Su nombre o parte del nombre", "El brillo del monitor", "La velocidad del mouse"], 0, "La guía recomienda conocer el nombre o una parte."]]}], "powerpoint": [{"title": "El PowerPoint", "content": ["Es un programa que su uso está orientado a la creación de Presentaciones en base a Diapositivas o Proyecciones para diferentes tipos como ser: Exposición de Conferencias o de Temas específicos, Tesis de Grado, Perfiles de Proyectos, Comerciales Publicitarios, Proyecciones a un Auditorio, etc.", "Que es una Diapositiva. - Es una página en la cual se escribirá un texto, Insertará una Imagen, Organigrama o Gráfico Estadístico el cual representará el tema que se quiere exponer. Los elementos que están en una Diapositiva se los llama OBJETOS.", "Que es una Presentación. - Es un grupo de una o varias Diapositivas las cuales estarán creadas con una secuencia cronológica y ordenada para que la exposición del tema sea fácil de entender por las personas que verán dicha Presentación.", "Como en todo programa, existen 3 formas de ingresar a esta aplicación, veremos una por una:", "2º Escribir el nombre de archivo POWERPNT y clic en botón Aceptar", "1º Doble clic en el Icono                   ubicado en el Escritorio como Acceso Directo."], "quiz": [["¿Qué tema estás repasando en esta lección?", ["El PowerPoint", "Unidades de almacenamiento", "Partes del teclado"], 0, "Esta actividad identifica el tema de estudio seleccionado."]]}, {"title": "Estructura de la pantalla de PowerPoint", "content": ["Opción ARCHIVO. - Esta opción está ubicada en la esquina superior izquierda de la ventana de Power Point y abre el menú que se muestra a continuación:", "Cinta de Opciones. - Es el elemento que posee varias opciones textuales que muestran diversos botones de comandos los cuales realizaran o ejecutaran procesos específicos. (Guardar, Abrir, Ver, Imprimir, etc.). Con un Clic se elige la opción y los Botones de Comando.", "Botones de Comando. - Son botones gráficos que representan el proceso a efectuar. Se elige el botón con un Clic.", "Área o Zona de Edición o de Trabajo. - Sector que ocupa la mayor parte de la pantalla y es el lugar donde se escribirá o insertarán los objetos que irán en la Diapositiva. Tiene diferentes formatos o Diseños de Diapositivas.", "Barra de Estado. - Muestra información del estado en que se encuentra la Presentación (Cuantas Diapositivas hay y en cual nos encontramos).", "Panel de Diapositivas. - es el elemento donde se visualizan la cantidad y el orden de Diapositivas que hay en una Presentación. Solo se debe dar Clic en cada Diapositiva para ver su contenido.", "Botones de Vistas. - Son pequeños botones que tienen la utilidad de mostrar la forma de presentación de las Diapositivas. Estos botones los detallaremos en un tema posterior."], "quiz": [["¿Qué tema estás repasando en esta lección?", ["Estructura de la pantalla de PowerPoint", "Unidades de almacenamiento", "Partes del teclado"], 0, "Esta actividad identifica el tema de estudio seleccionado."]]}, {"title": "Crear una presentación", "content": ["Para empezar a crear una presentación, deberá abrir Microsoft Power Point y automáticamente le muestra el primer Diseño de Diapositiva en la cual usted deberá escribir la información.", "Una vez finalizada la primera Diapositiva para agregar una nueva realizar el siguiente procedimiento", "En el Panel que aparece, elegir el Diseño con un Clic.", "Elegir uno de los Temas o Estilos de Fondo", "Realizar en Power Point estas Diapositivas (Ambos ESTUDIANTES)", "Cada trabajo deberá guardarlo con el nombre del ESTUDIANTE que realizo cada Presentación."], "quiz": [["¿Qué tema estás repasando en esta lección?", ["Crear una presentación", "Unidades de almacenamiento", "Partes del teclado"], 0, "Esta actividad identifica el tema de estudio seleccionado."]]}, {"title": "Manejo de objetos", "content": ["En este capítulo aprenderemos a insertar OBJETOS (Imágenes, Autoformas, textos en estilo WordArt, Cuadros de Texto).", "Primeramente, se debe seleccionar un Diseño de Diapositiva en Blanco.", "Para Insertar Autoformas clic en el botón FORMAS, elegir la forma y con Clic Sostenido realizar el trazado del objeto.", "Marcar el mismo y con clic sostenido en una de", "las marcas arrastrar Mouse cuando se visualice el", "Para mover un objeto colocar el puntero sobre el", "mismo y cuando se visualice el indicador     mover Mouse con clic sostenido."], "quiz": [["¿Qué tema estás repasando en esta lección?", ["Manejo de objetos", "Unidades de almacenamiento", "Partes del teclado"], 0, "Esta actividad identifica el tema de estudio seleccionado."]]}, {"title": "Colocar transición de diapositiva", "content": ["La Transición de una Presentación significa el efecto especial que se verá al momento de cambiar de una diapositiva a otra y el Intervalo de tiempo entre una Diapositiva y otra.", "1º Clic en Transiciones y se visualizara el siguiente Cuadro:", "Ingresar a Power Point, elegir la Plantilla Bienvenido a Power Point y Crear.", "A dicha presentación asignarle los cambios:", "Guardar la Presentación con el nombre TRANSICIÓN DE... (Su Nombre).", "Ejecutar la Presentación y Hacerse Revisar", "Ingresar a Power Point, elegir la Plantilla Bienvenido a Power Point y Crear."], "quiz": [["¿Qué tema estás repasando en esta lección?", ["Colocar transición de diapositiva", "Unidades de almacenamiento", "Partes del teclado"], 0, "Esta actividad identifica el tema de estudio seleccionado."]]}, {"title": "Personalizar animación", "content": ["Este proceso le ayudará a usted para que su presentación tenga otros efectos visuales como ser el movimiento de los textos y gráficos al momento de su aparición en una Diapositiva. Para colocar los efectos respectivos se realiza el siguiente procedimiento:", "1º Clic en el objeto al cual se le colocara el efecto.", "3º Elegir uno de las opciones deseadas (vistas en este cuadro):", "Ejemplo dar clic en Más efectos de entrada.", "Colocarle Transición con efecto elegido por Ud. con intervalo de 3 segundos para todas las Diapositivas.", "Colocar como Estilo de la Presentación un Fondo a elección suya (Cualquier Fondo elegante).", "EN LA MISMA PRESENTACIÓN INSERTAR LAS SIGUIENTES 2 DIAPOSITIVAS"], "quiz": [["¿Qué tema estás repasando en esta lección?", ["Personalizar animación", "Unidades de almacenamiento", "Partes del teclado"], 0, "Esta actividad identifica el tema de estudio seleccionado."]]}, {"title": "Crear organigramas", "content": ["Un organigrama es la representación gráfica de la estructura de una Empresa u Organización.", "PARA REALIZAR EL ORGANIGRAMA DEL EJEMPLO DEBE SEGUIR LOS SIGUIENTES PASOS:", "Crear una Presentación Nueva. (Debe estar vacía la Diapositiva – En blanco)", "Aparece el siguiente Diseño y escribir en cada bloque:", "Para Insertar más bloques siga los pasos siguientes:", "Clic en el bloque donde se insertará: Ejemplo dar clic en el bloque HIJO 1", "Se verá un bloque abajo y escribir NIETO 1"], "quiz": [["¿Qué tema estás repasando en esta lección?", ["Crear organigramas", "Unidades de almacenamiento", "Partes del teclado"], 0, "Esta actividad identifica el tema de estudio seleccionado."]]}]};

function showTab(){document.body.classList.toggle('tutor-full',tab==='tutor');let u=syllabus[subject][unit];let area=document.getElementById('area');if(tab==='contenido'){area.innerHTML=`<div class="lesson"><h2>Contenido de estudio</h2>${u.content.length?u.content.map(t=>`<p>${safe(t)}</p>`).join(''):'<p>Consulta esta unidad con el texto guía original.</p>'}<div class="feedback">Resumen de apoyo: revisa los conceptos y después comprueba lo aprendido con el cuestionario.</div><div class="actions"><button class="btn" onclick="save({read:true});setTab('cuestionario')">He revisado el tema · Ir al cuestionario →</button></div></div>`}if(tab==='cuestionario')showQuiz();if(tab==='practico')practice();if(tab==='tutor')tutor()}
function showQuiz(){let q=syllabus[subject][unit].quiz;document.getElementById('area').innerHTML=`<h2>Comprueba lo aprendido</h2><p class="muted">Selecciona una respuesta por pregunta. Al finalizar recibirás corrección y recomendaciones.</p><form id="quiz" onsubmit="grade(event)">${q.map((a,i)=>`<div class="q"><strong>${i+1}. ${safe(a[0])}</strong>${a[1].map((v,j)=>`<label class="option"><input type="radio" name="q${i}" value="${j}" required> ${safe(v)}</label>`).join('')}</div>`).join('')}<button class="btn">Corregir mis respuestas</button></form><div id="result"></div>`}
function grade(e){e.preventDefault();let q=syllabus[subject][unit].quiz,f=new FormData(e.target),ok=0;let details=q.map((a,i)=>{const right=Number(f.get('q'+i))===a[2];if(right)ok++;return `<p><b>${right?'✓ Correcta':'✗ Por reforzar'}:</b> ${safe(a[0])}<br><small>${safe(a[3])}</small></p>`}).join('');let pct=Math.round(ok/q.length*100);save({done:true,score:pct});document.getElementById('result').innerHTML=`<div class="feedback ${pct<70?'warn':''}"><h3>Resultado: ${ok}/${q.length} · ${pct}%</h3><div class="meter"><div style="width:${pct}%"></div></div><p>${pct>=70?'Buen trabajo. Continúa con la práctica.':'Te recomendamos volver a revisar el contenido y repetir el cuestionario.'}</p>${details}<button class="btn secondary" onclick="setTab('contenido')">Repasar lección</button></div>`;document.getElementById('result').scrollIntoView({behavior:'smooth'})}
function practice(){let a=document.getElementById('area');if(subject==='windows'&&unit===1){a.innerHTML=`<h2>Simulador: el escritorio de Windows</h2><p>Actividad basada en el práctico del Tema 2: identifica y utiliza los iconos del escritorio y el botón Inicio.</p><div class="desk"><div class="desktop-icons"><button class="desk-icon" onclick="simFeedback('Has identificado el icono Este equipo.','one')">🖥️<br>Este equipo</button><button class="desk-icon" onclick="simFeedback('Has identificado la Papelera de reciclaje.','two')">🗑️<br>Papelera</button></div><div class="taskbar"><button class="btn secondary" onclick="simFeedback('¡Correcto! El botón Inicio da acceso a las aplicaciones.','three')">▦ Inicio</button>　Explorador　⌕</div></div><p class="muted">Pulsa Este equipo, Papelera y el botón Inicio. Después puedes practicar la creación de una carpeta en el Tema 9.</p><div id="simmsg" class="feedback">Selecciona uno de los elementos.</div>`;return}if(subject==='windows'&&(unit===8||unit===9)){a.innerHTML=`<h2>Práctico: crear una carpeta</h2><p>En la guía, el estudiante aprende a crear carpetas desde el escritorio. Aquí puedes realizar una versión simplificada.</p><div class="files"><strong>📁 Documentos</strong><div id="folderList" style="margin-top:15px"></div></div><label for="foldername">Nombre de la nueva carpeta</label><input id="foldername" class="field" placeholder="Ej. ITDS"><button class="btn" onclick="makeFolder()">+ Crear carpeta</button><div id="simmsg"></div>`;return}if(subject==='windows'&&unit===3){a.innerHTML=`<h2>Práctico: atajos de teclado</h2><p>La guía presenta atajos como Ctrl + C, Ctrl + V y Windows + E.</p><label>Escribe el atajo que sirve para copiar</label><input id="shortcut" class="field" placeholder="Ej. Ctrl + ..."><button class="btn" onclick="checkShortcut()">Comprobar</button><div id="simmsg"></div>`;return}a.innerHTML=`<h2>Actividad guiada</h2><p>Para este tema, la demo ofrece una práctica de repaso. Las simulaciones específicas del documento se implementarán gradualmente.</p><label>Explica con tus palabras lo que aprendiste</label><input id="reflection" class="field" placeholder="Escribe una acción o concepto del tema"><button class="btn" onclick="reflect()">Guardar mi práctica</button><div id="simmsg"></div>`}
function simFeedback(msg){document.getElementById('simmsg').textContent=msg;save({practice:true})}function makeFolder(){let s=document.getElementById('foldername').value.trim();document.getElementById('simmsg').innerHTML=s?'<div class="feedback">✓ Carpeta creada correctamente. ¡Práctica realizada!</div>':'<div class="feedback warn">Primero escribe el nombre de la carpeta.</div>';if(s){document.getElementById('folderList').textContent='📁 '+s;save({practice:true})}}function checkShortcut(){let s=document.getElementById('shortcut').value.toLowerCase().replace(/\s/g,'');let ok=s==='ctrl+c'||s==='control+c';document.getElementById('simmsg').innerHTML=`<div class="feedback ${ok?'':'warn'}">${ok?'✓ Correcto, Ctrl + C copia el elemento seleccionado.':'Revisa el material: la combinación correcta es Ctrl + C.'}</div>`;if(ok)save({practice:true})}function reflect(){let s=document.getElementById('reflection').value.trim();document.getElementById('simmsg').innerHTML=`<div class="feedback ${s?'':'warn'}">${s?'Tu reflexión quedó registrada en esta sesión. Compara tu respuesta con la lección.':'Escribe tu respuesta antes de continuar.'}</div>`;if(s)save({practice:true})}
function tutor(){
 const u=syllabus[subject][unit];
 document.getElementById('area').innerHTML=`<h2>💬 Tutor conversacional ITDS</h2><p class="muted">Simulación de chat educativo: escribe tus preguntas libremente. Las respuestas se generan con reglas locales y los contenidos de la guía ITDS; no utiliza IA en línea.</p><div class="chatbot-frame"><div class="chatbot-head"><button class="tutor-back" type="button" onclick="setTab('contenido')" aria-label="Volver a la lección">← Volver</button><span class="tutor-title"><strong>Tutor ITDS · ${safe(u.title)}</strong><small>Asistente conversacional de demostración</small></span></div><div class="chat" id="chat" role="log" aria-live="polite"><div class="bubble">¡Hola, Abel! Soy tu tutor ITDS. Estamos estudiando <b>${safe(u.title)}</b>. Puedes pedirme una explicación, un ejemplo, una pregunta para practicar o escribir tu duda.</div></div><div class="chat-suggestions"><button class="btn secondary" onclick="chat('Explícame el tema')">Explícame el tema</button><button class="btn secondary" onclick="chat('Dame un ejemplo')">Dame un ejemplo</button><button class="btn secondary" onclick="chat('Hazme una pregunta')">Hazme una pregunta</button><button class="btn secondary" onclick="chat('Quiero practicar')">Quiero practicar</button></div><form class="chat-form" onsubmit="sendTutor(event)"><input id="tutorInput" type="text" placeholder="Escribe tu pregunta para el tutor..." maxlength="550" autocomplete="off" aria-label="Mensaje para el tutor" required><button class="btn" type="submit">Enviar ➤</button></form><div class="chat-note">Las respuestas son simuladas. Para conectar una IA real se requiere una API y un servidor seguro.</div></div>`;
}
let tutorQuestion=-1;
function chat(what){let input=document.getElementById('tutorInput');if(input){input.value=what;sendTutor(new Event('submit',{cancelable:true}))}}
function sendTutor(e){e.preventDefault();const input=document.getElementById('tutorInput');if(!input)return;const value=input.value.trim();if(!value)return;input.value='';addTutorBubble(value,true);const response=makeTutorReply(value);addTutorBubble(response,false);input.focus()}
function addTutorBubble(message,user){const log=document.getElementById('chat');if(!log)return;const div=document.createElement('div');div.className='bubble'+(user?' user':'');div.textContent=message;log.appendChild(div);log.scrollTop=log.scrollHeight}
function cleanTutor(t){return t.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9 ñ]/g,' ').replace(/\s+/g,' ').trim()}
function makeTutorReply(prompt){
 const u=syllabus[subject][unit],t=cleanTutor(prompt),parts=u.content||[],q=u.quiz||[];
 const last=t.match(/\b([a-d])\b/)||t.match(/\b([1-4])\b/);
 if(tutorQuestion>=0 && last){const item=q[tutorQuestion];if(item){const idx=/^[1-4]$/.test(last[1])?Number(last[1])-1:last[1].charCodeAt(0)-97;const good=idx===item[2];tutorQuestion=-1;return (good?'¡Muy bien, respuesta correcta! ':'Casi. La respuesta correcta es: '+item[1][item[2]]+'. ')+item[3]+' ¿Deseas otra pregunta?'}}
 if(/(hola|buenas|saludos|como estas)/.test(t))return '¡Hola, Abel! Puedes preguntarme sobre «'+u.title+'», solicitar una explicación, pedir ejemplos o practicar con una pregunta.';
 if(/(pregunta|cuestionario|exam|evalu|test|quiz)/.test(t)){if(!q.length)return 'Este tema todavía no tiene preguntas configuradas en la demo. Puedes repasar la lección o realizar una práctica.';tutorQuestion=(tutorQuestion+1)%q.length;const item=q[tutorQuestion];return 'Vamos a comprobar lo aprendido. '+item[0]+'\n'+item[1].map((v,i)=>String.fromCharCode(65+i)+') '+v).join('\n')+'\nEscribe A, B o C para responder.'}
 if(/(practic|ejercici|simulad|actividad|hacer)/.test(t))return 'Para aplicar lo aprendido, abre la pestaña «Práctico» de este mismo tema. Allí encontrarás una actividad guiada. Intenta resolverla antes de consultar las indicaciones.';
 if(/(resultado|nota|progreso|calificacion|avance)/.test(t))return 'Puedes consultar tus avances en «Mi progreso». Los resultados se guardan localmente en este navegador, solo para la demostración.';
 if(/(resumen|explica|explicacion|tema|leccion|repas|que estudia)/.test(t))return parts.length?'Te explico «'+u.title+'»:\n'+parts.slice(0,2).join('\n\n').slice(0,840)+'\n\n¿Sobre qué concepto quieres profundizar?':'Revisa la pestaña Lección para estudiar los contenidos disponibles de este tema.';
 if(/(ejemplo|paso a paso|como se hace|como hago)/.test(t))return parts.length?'Veamos un ejemplo relacionado con «'+u.title+'». Primero identifica el concepto principal: '+parts[0].slice(0,360)+'\nDespués abre «Práctico» para realizar una actividad sobre este contenido.':'Comienza repasando la lección y después completa la pestaña «Práctico».';
 const stop=new Set(['que','como','para','porque','cual','donde','tengo','sobre','quiero','puedo','sirve','hacer','necesito','esto','este','esta','una','uno','unos','las','los','del','con','por','mas','muy','sus','hay','son','me','se','el','la','un','al','en','de','y','a']);
 const terms=cleanTutor(prompt).split(' ').filter(w=>w.length>3&&!stop.has(w));
 let best='',score=0;
 for(const p of parts){let norm=cleanTutor(p);let count=terms.filter(w=>norm.includes(w)).length;if(count>score){score=count;best=p}}
 if(score>=1)return 'En el material de este tema encontré una explicación relacionada:\n'+best.slice(0,740)+'\n\n¿Quieres que te lo explique con otras palabras o que te haga una pregunta?';
 const glossary=[[/hardware/,'Hardware es la parte física del computador: monitor, teclado, mouse, discos y otros dispositivos.'],[/software/,'Software es la parte lógica del computador, como Windows, Word o Paint.'],[/escritorio/,'El escritorio es la pantalla principal de Windows; incluye iconos, fondo y barra de tareas.'],[/mouse|raton/,'Con el mouse puedes seleccionar mediante clic, abrir con doble clic y mover elementos con clic sostenido.'],[/teclado/,'El teclado permite introducir información y usar atajos como Ctrl + C para copiar y Ctrl + V para pegar.'],[/carpeta|archivo/,'Una carpeta organiza archivos. Puedes crearla desde el menú Nuevo en el escritorio o el Explorador.'],[/ventana/,'Las ventanas tienen controles para minimizar, maximizar, restaurar y cerrar aplicaciones.']];
 for(const [re,ans] of glossary)if(re.test(t))return ans+' Puedes consultar los detalles en el tema correspondiente de la guía ITDS.';
 return 'Buena pregunta, Abel. Para no inventar información que no aparece en el material de este tema, te propongo revisar «'+u.title+'». Prueba preguntarme por un término específico de la lección, o escribe «Explícame el tema», «Hazme una pregunta» o «Quiero practicar».';
}
function progress(){let all=[...syllabus.windows.map((u,i)=>({s:'windows',i,u})),...syllabus.powerpoint.map((u,i)=>({s:'powerpoint',i,u}))],read=all.filter(x=>JSON.parse(localStorage.getItem(`itds_${x.s}_${x.i}`)||'{}').read).length,done=all.filter(x=>JSON.parse(localStorage.getItem(`itds_${x.s}_${x.i}`)||'{}').done).length;draw(`<div class="crumb"><button onclick="course()">Windows y PowerPoint</button> / Progreso</div><section class="panel"><span class="pill">Registro local · Demo</span><h1>Mi progreso académico</h1><p><b>Estudiante:</b> ${student}</p><p>Lecciones revisadas: <b>${read}/${all.length}</b></p><p>Cuestionarios completados: <b>${done}/${all.length}</b></p><div class="meter"><div style="width:${done/all.length*100}%"></div></div><p class="muted">Los avances se guardan solo en este navegador. No se envían a una cuenta académica ni al docente.</p><button class="btn" onclick="course()">Continuar estudiando</button></section>`)}
if(auth)careers();else welcome();
</script></body></html>
